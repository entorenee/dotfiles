# rtk (Rust Token Killer) configuration. Deployed read-only from the Nix store,
# so an edit is inert until `make rebuild` — test with `rtk rewrite "<cmd>"`
# only after it.

[hooks]
# Commands the rtk-rewrite hook leaves raw (`rtk rewrite` exits 1), so Claude
# Code's own permission rules match them. Prefix-matched: an entry can't target
# one flag, only the whole command. Reasons as of rtk 0.41.0.
exclude_commands = [
  "gh run view", # `--job <id> --log` errors "Run ID required"
  "gh pr diff",  # compacted; line-by-line review needs the full diff
  "gh api",      # corrupts raw output piped to `base64 -d`
  # Restores a prompt: rewritten, it matches `Bash(rtk *)` in allow instead of
  # its `permissions.ask` rule. Check any new ask rule with `rtk rewrite` and
  # list it here if rewritten (deny rules pass through untouched).
  "gh pr edit",
  # Refuses -not/!/-o/-exec/-print0 with exit 1, which a pipe masks as an
  # empty result; silently drops unknown flags like -newermt.
  "find",
  # Reads -v as its own --verbose (returns the matches) and -h as --help;
  # exit 0, clean stderr.
  "grep",
]
transparent_prefixes = []
