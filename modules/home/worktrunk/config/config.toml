# Worktrunk user config (Nix-managed, read-only).
#
# Deployed by modules/home/worktrunk/default.nix to ~/.config/worktrunk/config.toml,
# which is the only path worktrunk reads (36ba57b) — it has no system or
# XDG_CONFIG_DIRS layer to fall back on.
#
# A read-only store symlink is safe here because worktrunk keeps machine-local
# state in <repo>/.git/wt/, not in this file, so nothing writes it behind our
# back. The tradeoff: user-invoked `wt config` writes (approvals, aliases) do
# not persist and have to be declared here instead.
#
# Edit here, then `make rebuild`.

skip-shell-integration-prompt = true

[post-start]
copy = "wt step copy-ignored"

# bd finds the primary's database through the git common dir; a copied
# embeddeddolt/ would give the worktree a private, diverging copy instead.
[step.copy-ignored]
exclude = [".beads/"]

# Global, so it fires for every repo; dot-use is a no-op unless the worktree
# being removed is the live dotfiles checkout. Store path via ~/.local/bin, not
# the pointer — the pointer may be the very worktree going away.
[pre-remove]
dotfiles-pointer = '"$HOME/.local/bin/dot-use" --if-live "{{ worktree_path }}" "{{ primary_worktree_path }}"'

[post-switch]
tmux = "$HOME/.local/state/dotfiles/active/modules/home/worktrunk/hooks/tmux-switch.sh {{ branch | sanitize }} {{ worktree_path }}"
pnpm-warm = "$HOME/.local/state/dotfiles/active/modules/home/worktrunk/hooks/pnpm-warm.sh {{ worktree_path }}"
