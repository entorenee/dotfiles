# Applied by hand: Settings > Manage Settings > Browse .cfg Files. The file
# browser hides /.rockbox unless Show Files is set to All.
# Loading a .cfg sets only the keys it names, so volume, resume state and
# the EQ preset are left alone. The player owns config.cfg; rockbox-sync
# backs that up rather than overwriting it.

# Display
font: /.rockbox/fonts/21-Adobe-Helvetica.fnt
sbs: /.rockbox/wps/classic_statusbar.sbs
qs top: -
qs left: shuffle
qs right: repeat
qs bottom: -

# Database
tagcache_autoupdate: on
tagcache_ram: on

# Playback. play log feeds rockbox-scrobble.
play log: on
pause on headphone unplug: pause
idle poweroff: 10
crossfade: off
replaygain noclip: on
